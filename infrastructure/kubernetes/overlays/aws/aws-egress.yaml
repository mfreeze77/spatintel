apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-managed-services-egress
  namespace: sip-system
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - api
      - worker
      - migration
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.42.0.0/16
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 443
  - ports:
    - protocol: TCP
      port: 443
