apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-api
  namespace: sip-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-policy
  namespace: sip-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-policy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scene-service
  namespace: sip-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: evidence-service
  namespace: sip-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evidence-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: sip-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-api
  namespace: sip-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: control-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
