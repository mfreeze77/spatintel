name: ${SIP_COMPOSE_PROJECT_NAME:-sip}

x-common-environment: &common-environment
  SIP_ENV: development
  SIP_ALLOW_DEVELOPMENT_AUTH: "true"
  SIP_POSTGRES_HOST: postgres
  SIP_POSTGRES_PORT: "5432"
  SIP_POSTGRES_DB: sip
  SIP_POSTGRES_USER: sip
  SIP_OBJECT_STORE_BACKEND: ${SIP_OBJECT_STORE_BACKEND:-local}
  SIP_OBJECT_STORE_ROOT: /var/lib/sip/objects
  SIP_MULTIPART_ROOT: /var/lib/sip/runtime/multipart
  SIP_MASTER_KEY_ID: compose-development-v1
  SIP_S3_ENDPOINT_URL: http://minio:9000
  SIP_S3_BUCKET: sip-local
  SIP_S3_REGION: us-east-1
  SIP_LOG_LEVEL: ${SIP_LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${SIP_OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-common-secrets: &common-secrets
  - sip_postgres_password
  - sip_master_key_b64
  - sip_signing_key_b64
  - sip_valkey_password

x-python-service: &python-service
  image: sip/python:1.1.0-local
  build:
    context: ../..
    dockerfile: infrastructure/containers/Dockerfile.python
    args:
      SIP_BUILD_VERSION: 1.1.0
      SIP_BUILD_REVISION: ${SIP_BUILD_REVISION:-uncommitted}
  restart: unless-stopped
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  volumes:
    - sip_objects:/var/lib/sip/objects
    - sip_runtime:/var/lib/sip/runtime
  environment: *common-environment
  secrets: *common-secrets
  networks: [backend]
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 20s

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:f248a10d133f63d01aefab324f3462d7e1002e9cc1b65c6585626f6cb7a3d85c
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: sip
      POSTGRES_USER: sip
      POSTGRES_PASSWORD_FILE: /run/secrets/sip_postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256 --auth-local=peer
    secrets: [sip_postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sip -d sip"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512

  valkey-config:
    image: valkey/valkey:9.1.1-alpine3.24@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [sip_valkey_password]
    volumes:
      - ./config/valkey.conf:/source/valkey.conf:ro
      - valkey_config:/generated
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /source/valkey.conf /generated/valkey.conf
        printf '\nrequirepass %s\n' "$$(cat /run/secrets/sip_valkey_password)" >> /generated/valkey.conf
        chown 999:999 /generated/valkey.conf
        chmod 0600 /generated/valkey.conf
    networks: [backend]

  valkey:
    image: valkey/valkey:9.1.1-alpine3.24@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    restart: unless-stopped
    user: "999:999"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - valkey_data:/data
      - valkey_config:/usr/local/etc/valkey:ro
    command: [valkey-server, /usr/local/etc/valkey/valkey.conf]
    secrets: [sip_valkey_password]
    networks: [backend]
    depends_on:
      valkey-config:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "VALKEYCLI_AUTH=$$(cat /run/secrets/sip_valkey_password) valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The upstream image is archived. This service is intentionally local-only,
  # never used by production profiles, and guarded by the provider/license gate.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [local-object-store]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/sip_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/sip_minio_root_password
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:${SIP_MINIO_CONSOLE_PORT:-9001}
    secrets: [sip_minio_root_user, sip_minio_root_password]
    volumes:
      - minio_data:/data
    ports:
      - 127.0.0.1:${SIP_MINIO_API_PORT:-9000}:9000
      - 127.0.0.1:${SIP_MINIO_CONSOLE_PORT:-9001}:9001
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    <<: *python-service
    restart: "no"
    read_only: true
    command: [alembic, upgrade, head]
    healthcheck: {disable: true}
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    <<: *python-service
    environment:
      <<: *common-environment
      SIP_SERVICE_NAME: control-api
