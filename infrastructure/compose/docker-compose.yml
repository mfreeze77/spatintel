      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SIP_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle=false
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/prometheus-rules.yaml:/etc/prometheus/prometheus-rules.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:${SIP_PROMETHEUS_PORT:-9090}:9090
    networks: [backend]
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: [observability]
    restart: unless-stopped
    user: "472:472"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    environment:
      GF_SECURITY_ADMIN_USER: ${SIP_GRAFANA_ADMIN_USER:-sip-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/sip_grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [sip_grafana_admin_password]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/sip-overview.json:/var/lib/grafana/dashboards/sip-overview.json:ro
    ports:
      - 127.0.0.1:${SIP_GRAFANA_PORT:-3001}:3000
    networks: [backend]
    depends_on:
      - prometheus

  web:
    image: sip/web:1.1.0-local
    build:
      context: ../..
      dockerfile: infrastructure/containers/Dockerfile.web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      NEXT_PUBLIC_SIP_API_BASE: http://127.0.0.1:${SIP_API_PORT:-8080}
      SIP_INTERNAL_API_BASE: http://control-api:8080
    ports:
      - 127.0.0.1:${SIP_WEB_PORT:-3000}:3000
    networks: [edge]
    depends_on:
      control-api:
        condition: service_healthy

secrets:
  sip_postgres_password:
    file: ./secrets/postgres_password.txt
  sip_minio_root_user:
    file: ./secrets/minio_root_user.txt
  sip_minio_root_password:
    file: ./secrets/minio_root_password.txt
  sip_valkey_password:
    file: ./secrets/valkey_password.txt
  sip_master_key_b64:
    file: ./secrets/master_key_b64.txt
  sip_signing_key_b64:
    file: ./secrets/signing_key_b64.txt
  sip_grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  postgres_data: {}
  valkey_data: {}
  valkey_config: {}
  minio_data: {}
  sip_objects: {}
  sip_runtime: {}
  worker-capture-normalizer-runtime: {}
  worker-change-detection-runtime: {}
  worker-collision-navigation-runtime: {}
  worker-depth-normalizer-runtime: {}
  worker-document-media-runtime: {}
  worker-fusion-tsdf-runtime: {}
  worker-geometry-cleanup-runtime: {}
  worker-lingbot-adapter-runtime: {}
  worker-mesh-lod-runtime: {}
  worker-pose-optimizer-runtime: {}
  worker-report-export-runtime: {}
  worker-representation-quality-runtime: {}
  worker-semantics-runtime: {}
  worker-splat-runtime: {}
  worker-splat-normalizer-runtime: {}
  worker-splat-surface-runtime: {}
  prometheus_data: {}
  grafana_data: {}

networks:
  edge: {}
  backend:
    internal: true
