name: Progress 07 Security Controls
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sip-progress07-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.14'
      - run: python -m pip install -e '.[dev,postgres,redis,telemetry]'
      - run: PYTHONPATH=src:. python tools/progress07_supply_chain_check.py
      - run: PYTHONPATH=src:. pytest -q tests/security tests/contract/test_progress07_security_api.py tests/integration/test_progress07_security_ops.py -p no:ddtrace -p no:cov -p no:json-report
      - run: make spec-check contracts migrations
