name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sip-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  release-gate:
    name: Fail-closed release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.14"
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
      - name: Install pinned Python dependencies and release scanners
        run: |
          python -m pip install -e '.[dev,postgres,redis,telemetry]'
          python -m pip install pip-audit==2.9.0
      - name: Require a frozen JavaScript dependency graph
        run: |
          test -f pnpm-lock.yaml
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
      - name: Build and typecheck web application
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web build
      - name: Run complete local release gates
        run: |
          make lint
          make spec-check
          make test-all
          PYTHONPATH=src:. python tools/typecheck.py --release
          PYTHONPATH=src:. python tools/security_check.py --release
          PYTHONPATH=src:. python tools/license_check.py --release
          make benchmark
          make demo-foundation
          make demo-hybrid
          make demo-construction
          make demo-liveforever
      - name: Create signed release bundle
        env:
          SIP_RELEASE_SIGNING_KEY_B64: ${{ secrets.SIP_RELEASE_SIGNING_KEY_B64 }}
        run: PYTHONPATH=src:. python tools/release.py --mode release
      - name: Upload release bundle and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sip-release-${{ github.ref_name }}
          path: |
            build/release
            build/reports
            build/evidence
          if-no-files-found: error
          retention-days: 90
