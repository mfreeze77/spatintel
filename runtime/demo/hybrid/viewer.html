body{font:16px system-ui;margin:0;background:#101318;color:#eef2f7}header,main{padding:1rem}fieldset{border:1px solid #596273;margin:.75rem 0}button,label{margin:.35rem}pre{white-space:pre-wrap;background:#171c24;padding:1rem;border-radius:.4rem}.warning{background:#4b2f00;padding:.75rem;border-left:4px solid #ffb347}canvas{width:100%;height:320px;background:#080a0d;border:1px solid #596273}

<header><h1>Spatial Intelligence Platform — Portable Viewer</h1><p class="warning">Visual and interaction layers are not authoritative measurements. Verify against eligible metric evidence.</p></header>
<main><fieldset><legend>Representation layers</legend><div id="layers"></div></fieldset><canvas id="canvas" width="960" height="320" aria-label="Synthetic spatial layer overview"></canvas><h2>Evidence and authority</h2><pre id="evidence"></pre></main>
<script type="application/json" id="session">{&quot;commit_id&quot;: &quot;75c063ef-60d0-4b25-8b66-8e7e005f69b6&quot;, &quot;evidence&quot;: {&quot;diff&quot;: {&quot;entities&quot;: {&quot;added&quot;: [], &quot;modified&quot;: [], &quot;removed&quot;: []}, &quot;left&quot;: &quot;d98861cf-c0a4-4e9b-ac06-66153a44ed20&quot;, &quot;representation_changed&quot;: true, &quot;right&quot;: &quot;75c063ef-60d0-4b25-8b66-8e7e005f69b6&quot;}, &quot;direct_measurement_error&quot;: &quot;PROXY_MEASUREMENT_CANNOT_BE_VERIFIED&quot;, &quot;proxy_resolution&quot;: {&quot;acceptance_threshold_m&quot;: 0.03, &quot;authoritative_measurement_allowed&quot;: true, &quot;estimated_residual_m&quot;: 0.01, &quot;interaction_hit&quot;: {&quot;normal&quot;: [0.0, 1.0, 0.0], &quot;representation_id&quot;: &quot;10f7fb60-2e11-42e7-8777-de7cf95c4b3e&quot;, &quot;representation_kind&quot;: &quot;interaction&quot;, &quot;support_hint&quot;: {}, &quot;world_point&quot;: [1.0, 1.0, 0.0]}, &quot;metric_representation_id&quot;: &quot;3c24f2fd-95f4-4791-8b89-e27432166fae&quot;, &quot;metric_source_asset_ids&quot;: [&quot;45edaa4f-ce6b-457a-b0ed-f7c680da2ebe&quot;], &quot;proxy_representation_id&quot;: &quot;10f7fb60-2e11-42e7-8777-de7cf95c4b3e&quot;, &quot;reason&quot;: null, &quot;resolved&quot;: true, &quot;resolved_metric_evidence&quot;: {&quot;acceptance_threshold_m&quot;: 0.03, &quot;coordinate_frame_id&quot;: &quot;world&quot;, &quot;estimated_residual_m&quot;: 0.01, &quot;metric_representation_id&quot;: &quot;3c24f2fd-95f4-4791-8b89-e27432166fae&quot;, &quot;metric_source_asset_ids&quot;: [&quot;45edaa4f-ce6b-457a-b0ed-f7c680da2ebe&quot;], &quot;resolution_method&quot;: &quot;support_map_metric_reprojection&quot;}, &quot;world_point&quot;: [1.0, 1.0, 0.0]}, &quot;replacement&quot;: {&quot;new_representation_id&quot;: &quot;249c45cd-01f2-419b-91f5-c3e206865ac8&quot;, &quot;old_representation_id&quot;: &quot;10f7fb60-2e11-42e7-8777-de7cf95c4b3e&quot;, &quot;reprojected&quot;: 1, &quot;reprojected_anchor_ids&quot;: [&quot;anchor-panel&quot;], &quot;unresolved&quot;: 1, &quot;unresolved_anchors&quot;: [{&quot;anchor_id&quot;: &quot;anchor-removed&quot;, &quot;point&quot;: [3.5, 1.0, 0.0], &quot;semantic_support_id&quot;: &quot;entity-removed&quot;}]}}, &quot;layers&quot;: [{&quot;authority&quot;: &quot;metric&quot;, &quot;kind&quot;: &quot;metric&quot;, &quot;representation_id&quot;: &quot;3c24f2fd-95f4-4791-8b89-e27432166fae&quot;, &quot;role&quot;: &quot;measurement&quot;}, {&quot;authority&quot;: &quot;visual&quot;, &quot;kind&quot;: &quot;visual&quot;, &quot;representation_id&quot;: &quot;6e48ae83-8452-43cd-902b-c530487119ac&quot;, &quot;role&quot;: &quot;render&quot;}, {&quot;authority&quot;: &quot;design&quot;, &quot;kind&quot;: &quot;design&quot;, &quot;representation_id&quot;: &quot;53ce58a9-e0b4-498d-b85a-b0d03e324a2f&quot;, &quot;role&quot;: &quot;design_compare&quot;}, {&quot;authority&quot;: &quot;interaction&quot;, &quot;kind&quot;: &quot;interaction&quot;, &quot;representation_id&quot;: &quot;249c45cd-01f2-419b-91f5-c3e206865ac8&quot;, &quot;role&quot;: &quot;picking&quot;}], &quot;scene_id&quot;: &quot;fbea714e-7992-4e27-b439-cf562c81eecd&quot;, &quot;schema&quot;: &quot;sip.portable-viewer-session/v1&quot;}</script>
<script>
const data=JSON.parse(document.getElementById('session').textContent);const layers=document.getElementById('layers');const evidence=document.getElementById('evidence');const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);let i=0;for(const layer of data.layers||[]){const box=document.getElementById('layer-'+i);if(box&&box.checked){ctx.strokeStyle=['#7dd3fc','#f9a8d4','#fde68a','#86efac','#c4b5fd'][i%5];ctx.lineWidth=3;ctx.strokeRect(70+i*95,50+i*18,520-i*40,200-i*22);ctx.fillStyle=ctx.strokeStyle;ctx.fillText(layer.kind+' / '+layer.authority,80+i*95,75+i*18);}i++;}}
(data.layers||[]).forEach((layer,i)=>{const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.checked=true;box.id='layer-'+i;box.addEventListener('change',draw);label.append(box,document.createTextNode(' '+layer.kind+' — '+layer.role+' — '+layer.authority));layers.append(label,document.createElement('br'));});evidence.textContent=JSON.stringify(data.evidence||{},null,2);draw();
</script>
